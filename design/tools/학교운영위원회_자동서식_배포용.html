<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학교운영위원회 자동서식</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --navy:#14273f; --navy2:#1e3a5f; --navy3:#2c4f7c; --gold:#c9a227;
  --line:#d7dde6; --bg:#eef1f5; --paper:#ffffff; --ink:#1a1a1a; --muted:#6b7684;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Malgun Gothic','Noto Sans KR',sans-serif; background:var(--bg); color:var(--ink);}
.app{display:flex; min-height:100vh;}
.sidebar{width:230px; background:var(--navy); color:#fff; flex-shrink:0; display:flex; flex-direction:column;}
.sidebar .brand{padding:20px 18px 14px; border-bottom:1px solid rgba(255,255,255,.15);}
.sidebar .brand h1{font-size:16px; font-weight:700; line-height:1.4;}
.sidebar .brand p{font-size:11px; color:#aebbd0; margin-top:4px;}
.nav{flex:1; overflow-y:auto; padding:10px 0;}
.nav button{display:block; width:100%; text-align:left; background:none; border:none; color:#c6d2e2;
  padding:9px 18px; font-size:13px; cursor:pointer; font-family:inherit; border-left:3px solid transparent;}
.nav button:hover{background:rgba(255,255,255,.07); color:#fff;}
.nav button.active{background:rgba(255,255,255,.12); color:#fff; border-left-color:var(--gold); font-weight:700;}
.nav .sec{padding:12px 18px 5px; font-size:10.5px; letter-spacing:.12em; color:#7e90a9; font-weight:700;}
.sidebar .foot{padding:12px 18px; font-size:10.5px; color:#7e90a9; border-top:1px solid rgba(255,255,255,.15);}
.main{flex:1; display:flex; flex-direction:column; min-width:0;}
.toolbar{background:#fff; border-bottom:2px solid var(--navy); padding:10px 22px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.toolbar .title{font-size:15px; font-weight:700; color:var(--navy); margin-right:auto;}
.btn{border:1px solid var(--navy2); background:#fff; color:var(--navy2); padding:7px 14px; border-radius:4px;
  font-size:12.5px; cursor:pointer; font-family:inherit; font-weight:600;}
.btn:hover{background:var(--navy2); color:#fff;}
.btn.primary{background:var(--navy2); color:#fff;}
.btn.primary:hover{background:var(--navy);}
.btn.sm{padding:3px 9px; font-size:11.5px;}
.content{flex:1; overflow-y:auto; padding:24px;}

.card{background:#fff; border:1px solid var(--line); border-radius:6px; margin-bottom:18px; overflow:hidden;}
.card h2{background:var(--navy2); color:#fff; font-size:13.5px; padding:9px 16px; font-weight:700;}
.card h2 .hint{font-weight:400; font-size:11px; color:#c6d2e2; margin-left:8px;}
.card .body{padding:16px;}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px;}
.fld label{display:block; font-size:11.5px; color:var(--muted); font-weight:700; margin-bottom:4px;}
.fld input,.fld select,.fld textarea{width:100%; border:1px solid var(--line); border-radius:4px; padding:7px 9px; font-size:13px; font-family:inherit;}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none; border-color:var(--navy3);}
.fld .auto{background:#f4f7fb; color:var(--navy2); font-weight:600;}
table.edit{width:100%; border-collapse:collapse; font-size:12.5px;}
table.edit th{background:#f2f5f9; border:1px solid var(--line); padding:6px; color:var(--navy); font-size:11.5px;}
table.edit td{border:1px solid var(--line); padding:3px;}
table.edit td input, table.edit td select, table.edit td textarea{width:100%; border:none; padding:5px 6px; font-size:12.5px; font-family:inherit; background:transparent; resize:vertical;}
table.edit td input:focus, table.edit td select:focus, table.edit td textarea:focus{outline:2px solid var(--navy3); outline-offset:-2px; background:#fff;}
table.edit .num{width:34px; text-align:center; color:var(--muted);}
table.edit .del{width:36px; text-align:center;}
table.edit .chk{width:44px; text-align:center;}
.xbtn{border:none; background:none; color:#b23b3b; cursor:pointer; font-size:14px; padding:2px 6px;}
.xbtn:hover{background:#fbeaea; border-radius:3px;}
.addrow{margin-top:8px;}
.note{font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.5;}
.agenda-detail{background:#f8fafc; border:1px solid var(--line); border-radius:5px; padding:12px; margin-bottom:10px;}
.agenda-detail .hd{font-weight:700; font-size:13px; color:var(--navy); margin-bottom:8px; display:flex; align-items:center; gap:8px;}
.agenda-detail .dgrid{display:grid; grid-template-columns:1fr 90px 90px 140px; gap:8px; margin-top:8px;}
@media(max-width:800px){.agenda-detail .dgrid{grid-template-columns:1fr 1fr;}}

.paper-wrap{display:flex; justify-content:center;}
.paper{width:210mm; min-height:297mm; background:var(--paper); box-shadow:0 2px 14px rgba(20,39,63,.18);
  padding:20mm 20mm; font-family:'Batang','Noto Serif KR',serif; font-size:12pt; line-height:1.7; color:#111;}
.paper .org{font-size:20pt; font-weight:700; letter-spacing:.12em; text-align:center; margin-bottom:6mm;}
.paper .doc-title{font-size:16pt; font-weight:700; text-align:center; margin:8mm 0 6mm; letter-spacing:.04em;}
.paper .row{display:flex; margin:1mm 0;}
.paper .row .lab{width:20mm; font-weight:700; flex-shrink:0;}
.paper table.doc{width:100%; border-collapse:collapse; margin:4mm 0; font-size:11pt;}
.paper table.doc th{border:1.5px solid #000; background:#f0f0f0; padding:2mm; font-weight:700;}
.paper table.doc td{border:1px solid #000; padding:2mm; text-align:center;}
.paper table.doc td.l{text-align:left;}
.paper .sign{text-align:center; font-size:16pt; font-weight:700; letter-spacing:.25em; margin:12mm 0 8mm;}
@media print{.paper{outline:none!important}}
.paper .footer{border-top:1.5px solid #000; margin-top:10mm; padding-top:2mm; font-size:9.5pt; line-height:1.7; font-family:'Malgun Gothic',sans-serif;}
.paper .indent{padding-left:8mm;}
.paper .indent2{padding-left:14mm;}
.blank{color:#bbb;}
.minutes h3{font-size:12pt; margin:4mm 0 1mm; font-weight:700;}
.minutes p{margin:.5mm 0;}
.mrec-body{line-height:1.4;}
.mrec-body p{margin:.3mm 0; line-height:1.4;}
.sc-doc{font-size:13pt; line-height:1.9;}
.sc-doc .sc-tbl{font-size:12.5pt;}
.sc-doc .sc-tbl th{background:#eef1f5; white-space:nowrap;}
.sc-doc .sc-tbl td{text-align:left; line-height:1.85; padding:2.5mm;}
.sc-doc .indent{padding-left:8mm; margin:.5mm 0;}
.rec-doc{font-size:12.5pt; line-height:1.8;}
.rec-doc .org{font-size:20pt; font-weight:700; letter-spacing:.12em; text-align:center; margin-bottom:8mm;}
.rec-doc .rec-tbl{margin:4mm 0; table-layout:fixed;}
.rec-doc .rec-tbl th{background:#f0f0f0;}
.rec-doc .rec-tbl td{padding:2mm; word-break:break-all;}
.no-print{}
@media print{ .no-print{display:none !important;} }

@media print{
  body{background:#fff;}
  .sidebar,.toolbar{display:none !important;}
  .content{padding:0; overflow:visible;}
  .paper{box-shadow:none; width:auto; min-height:auto; padding:0;}
  .paper-wrap{display:block;}
  .no-print{display:none !important;}
  /* 페이지 분할: 행·문단 중간에서 잘리지 않게 */
  table.doc tr{ break-inside:avoid; page-break-inside:avoid; }
  table.doc tr.flow-row{ break-inside:auto; page-break-inside:auto; }
  .minutes p, .sc-doc p{ break-inside:avoid; page-break-inside:avoid; }
  .sc-tbl{ break-inside:auto; }
  thead{ display:table-header-group; }
  @page{size:A4; margin:15mm;}
}
@media(max-width:900px){
  .app{flex-direction:column;}
  .sidebar{width:100%;}
  .paper{width:100%; padding:10mm;}
}
</style>

 .card,.input-card,.setting-card{padding:20px}
 .section-title{color:#1e3a5f;font-weight:700;line-height:1.6}
 .toolbar,.controls,.header-actions{gap:10px;flex-wrap:wrap}
 .toolbar{background:#fff;border-color:#dbe5ef;border-radius:10px}
 button,.btn,.header-btn,.calc-btn{border-radius:8px!important;min-height:40px;font-size:14px;font-weight:600;line-height:1.5;box-shadow:none!important}
 .btn-primary,.btn-blue,.btn-navy,.btn-main,button.primary,.calc-btn{background:#1e3a5f!important;border-color:#1e3a5f!important;color:#fff!important}
 .btn-line,.btn-sub,.btn.ghost,button.ghost{background:#fff;border:1px solid #cbd9e9;color:#1e3a5f}
 .tab-bar,.tabs,.subnav{gap:8px;border-color:#dbe5ef}
 .tab-btn,.tabs>.tab,.subnav>button{border-radius:8px;min-height:44px;font-size:14px;font-weight:600;line-height:1.6;word-break:keep-all}
 .tab-btn.active,.tabs>.tab.active,.tabs>.tab.on,.subnav>button.active,.subnav>button.on{background:#1e3a5f!important;border-color:#1e3a5f!important;color:#fff!important}
 .field input,.field select,.field textarea,.fld input,.fld select,.config-item input,.config-item select,.setting-card input,.setting-card select,.left input,.left select,.left textarea{border:1px solid #ccd9e8;border-radius:7px;min-height:42px;padding:9px 11px;font-size:15px;background:#fff;color:#243b58}
 .field label,.fld label,.config-item label{font-size:14px;line-height:1.6;color:#465e79}
 .drop{border-color:#a9c5e5;border-radius:10px;background:#f7faff;color:#1e3a5f}
 button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #2775ce66;outline-offset:2px}
 .credit,.maker,.sidebar .foot{line-height:1.8;font-size:12px}
}
@media screen and (max-width:600px){
 .card,.input-card,.setting-card{padding:16px}
 .toolbar,.controls,.header-actions{gap:8px}
 .toolbar button,.controls button,.header-actions button{font-size:13px;padding:9px 12px}
 .field input,.field select,.field textarea,.fld input,.fld select,.config-item input,.config-item select,.setting-card input,.setting-card select,.left input,.left select,.left textarea{font-size:16px}
 .tab-bar,.tabs,.subnav{flex-wrap:wrap}
 .tab-btn,.tabs>.tab,.subnav>button{font-size:13px;padding:10px 12px}
}

</style>

 .tab-bar .tab-btn:hover,.tabs>.tab:hover,.subnav>button:hover{background:rgba(30,58,95,.045)!important;color:var(--tc-primary)!important;border-color:transparent!important}
 .tab-bar .tab-btn.active,.tab-bar .tab-btn.on,.tabs>.tab.active,.tabs>.tab.on,.subnav>button.active,.subnav>button.on,.subnav>button[aria-selected=true]{background:var(--tc-tab)!important;color:var(--tc-tab-ink)!important;border-color:transparent!important;box-shadow:none!important}
 .sidebar .nav button{background:transparent!important;color:var(--tc-text)!important;border-color:transparent!important;box-shadow:none!important}
 .sidebar .nav button:hover{background:rgba(30,58,95,.055)!important;color:var(--tc-primary)!important;border-color:transparent!important}
 .sidebar .nav button.active,.sidebar .nav button.on{background:var(--tc-tab)!important;color:var(--tc-tab-ink)!important;border-color:transparent!important;box-shadow:none!important}
 .topbar{background:var(--tc-page)!important;border-color:var(--tc-border)!important;box-shadow:none!important}
 .topbar .title,#pageTitle{background:transparent!important;color:var(--tc-ink)!important;border-color:transparent!important;box-shadow:none!important}
}

<style id="tool-layout-2026">
/* 도구함 공통 배치 (Claude 담당, 2026-10-27) — 폭·간격·위치만. 색은 넣지 않는다(색은 Codex)
   맨 위 줄·본문·크레딧이 같은 시작선(--tl-gut, 화면 폭 vw 기준이라 안쪽 상자에서도 같은 값)을 쓰고, 간격은 --tl-gap 하나로 맞춘다
   도구별 파일(design/tool-layout/<도구>.css)에서 본문 상자에 padding-inline:var(--tl-gut) 등을 준다
   .tl-merge = 안내띠(로고·문의)를 도구 제목줄 위에 겹쳐 한 줄로 (배치넣기.js가 도구별 파일에 tl-merge가 있으면 붙임)
   제목줄 쪽은 도구별 파일에서 padding-left:var(--tl-hl) / padding-right:var(--tl-hr), min-height:var(--tl-head) */
@media screen{
 :root{--tl-wrap:1280px;--tl-gut:max(24px,calc((100vw - var(--tl-wrap)) / 2));--tl-gap:20px;--tl-pad:24px;--tl-head:84px;--tl-logo:84px;--tl-right:224px;--tl-close:0px;
  --tl-hl:calc(var(--tl-gut) + var(--tl-logo) + 24px);--tl-hr:calc(var(--tl-gut) + var(--tl-right) + var(--tl-close))}
 /* 포털 도구 창 안(openTool이 html에 data-in-portal을 붙임)에서는 오른쪽 끝에 포털의 닫기 버튼이 오므로 그만큼 비움 */
 html[data-in-portal]{--tl-close:72px}
 /* 안내띠: 겹치지 않는 도구도 한 줄 높이로 낮게 */
 .brand-tool-strip{margin:0!important;min-height:0!important;height:var(--tl-head);padding:0 calc(var(--tl-gut) + var(--tl-close)) 0 var(--tl-gut)!important;gap:12px!important;box-sizing:border-box}
 .brand-tool-strip img{width:var(--tl-logo)!important;height:42px!important}
 .brand-tool-strip .brand-tool-character{width:36px!important;height:60px!important}
 .brand-tool-strip a{white-space:nowrap}
 .brand-tool-footer,.design-author-credit{margin:0 var(--tl-gut)!important}
 /* 물품선정위원회 형식(.site-header·.main-wrap·.tab-bar·.card) 도구 */
 .site-header{padding:16px var(--tl-gut)!important;margin:0!important}
 .main-wrap{max-width:none!important;margin:0!important;padding:var(--tl-gap) var(--tl-gut) 48px!important}
 .tab-bar{margin:0 0 var(--tl-gap)!important;padding:6px!important;gap:4px!important;align-items:stretch}
 .tab-btn{min-height:44px!important;padding:8px 16px!important;gap:8px!important;align-items:center}
 .main-wrap .card{padding:var(--tl-pad)!important;margin:0 0 var(--tl-gap)!important}
 .main-wrap .card-header{margin-bottom:16px!important;padding-bottom:12px!important}
 .main-wrap .info-box{margin-bottom:var(--tl-gap)}
 .main-wrap .nav-actions{margin-top:var(--tl-gap)!important;justify-content:flex-end}
}
/* PC: 안내띠를 제목줄 위에 겹쳐 한 줄로 — 왼쪽 로고 | 제목 … 버튼 | 캐릭터·문의 */
@media screen and (min-width:701px){
 body:has(>.tl-merge){position:relative}
 .tl-merge{position:absolute!important;top:0;left:0;right:0;background:transparent!important;border:0!important;pointer-events:none;z-index:1000}
 .tl-merge>*{pointer-events:auto}
 .tl-merge>div{visibility:hidden}
}
@media screen and (max-width:700px){
 .brand-tool-strip{height:64px}
 .brand-tool-strip img{width:72px!important;height:36px!important}
}
@media screen and (max-width:600px){
 :root{--tl-gut:16px;--tl-gap:14px;--tl-pad:16px}
 .tab-btn{padding:8px 6px!important}
}
@media screen and (max-width:700px){html[data-in-portal]{--tl-close:62px}}

/* 학운위 자동서식 배치 (Claude, 2026-10-27 / 10-28 한 줄로): 왼쪽 메뉴가 화면 끝까지 붙는 구조라 PC는 맨 위 줄에 도구 이름을 두고(로고·이름·문의 한 줄) 메뉴 위 제목은 숨김, 본문은 그대로 */
@media screen and (min-width:701px){
 body>.brand-tool-strip{padding-left:var(--tl-gut)!important}
 body>.brand-tool-strip>div{margin-left:calc(var(--tl-hl) - var(--tl-gut) - var(--tl-logo) - 13px)!important}
 body>.brand-tool-strip>div>strong{display:block!important;font-size:0!important;line-height:1.5;font-weight:700!important}
 body>.brand-tool-strip>div>strong::after{content:"학교운영위원회 자동서식";font-size:28px}
 body>.brand-tool-strip>div>small{display:none!important}
 body>.app .sidebar>.brand{display:none!important}
}
</style>

const WD = ['일','월','화','수','목','금','토'];
const WDF = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
function D(iso){ if(!iso) return null; const d = new Date(iso+'T00:00:00'); return isNaN(d)?null:d; }
function fmtK(iso, full){ // 2026년 6월 25일(목) / (목요일)
  const d = D(iso); if(!d) return '';
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일(${full?WDF[d.getDay()]:WD[d.getDay()]})`;
}
function fmtDot(iso){ const d = D(iso); if(!d) return ''; return `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')}.`; }
function fmtDotShort(iso){ const d = D(iso); if(!d) return ''; return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}.`; }
const council = () => S.school + '운영위원회';
const roundYr = () => `${S.year}학년도 제${S.round||'○'}회`;
const roundHoe = () => `제${S.round||'○'}회 ${council()}`;
const chair = () => { const m = S.members.find(m=>m.type==='위원장'); return m && m.name ? m.name : ''; };
// 이름 가운데 글자 O 처리 (2자: 뒤글자O, 3자↑: 가운데 전부O). 한글 이름만, 직위/직함은 건드리지 않음
function maskName(name){
  if(!name) return name;
  const n = String(name).trim();
  if(n.length === 2) return n[0] + '○';
  if(n.length >= 3) return n[0] + '○'.repeat(n.length-2) + n[n.length-1];
  return n;
}
const mn = name => S.maskNames ? maskName(name) : name;
// 문장 속 이름 마스킹: "유삼석 위원장님", "담당자 박지은" 등에서 등록된 위원/담당자/간사 이름만 치환
function maskInText(text){
  if(!S.maskNames || !text) return text;
  let t = text;
  const names = [...S.members.map(m=>m.name), S.chargeName, S.secName].filter(x=>x && x.length>=2);
  // 긴 이름부터 치환(부분매칭 방지)
  names.sort((a,b)=>b.length-a.length).forEach(nm=>{
    t = t.split(nm).join(maskName(nm));
  });
  return t;
}

/* ───────────── 복사 · 직접수정 ───────────── */
function copyText(btn){
  const paper = document.querySelector('.paper');
  if(!paper) return;
  const text = paper.innerText.replace(/\n{3,}/g,'\n\n').trim();
  navigator.clipboard.writeText(text).then(()=>{
    const t = btn.textContent;
    btn.textContent = '✅ 복사했어요';
    setTimeout(()=>btn.textContent = t, 1500);
  }).catch(()=>{
    // 클립보드 미지원 시 폴백
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    btn.textContent = '✅ 복사했어요';
    setTimeout(()=>btn.textContent = '📋 텍스트 복사', 1500);
  });
}
function savePDF(){
  // 브라우저 인쇄 파이프라인 사용 → 긴 문서도 페이지 자동 분할(잘림 없음)
  const docName = DOCS.find(d=>d.id===cur).name.replace(/^[0-9]+\\.\\s*/,'').replace(/[🏠📢👤\\s]/g,'');
  const prevTitle = document.title;
  document.title = `${S.year}학년도_제${S.round}회_${docName}_${S.school}`;
  window.print();
  setTimeout(()=>{ document.title = prevTitle; }, 500);
}
function toggleEdit(btn){
  const paper = document.querySelector('.paper');
  if(!paper) return;
  editMode = !editMode;
  paper.contentEditable = editMode;
  if(editMode){
    btn.textContent = '✔ 수정 완료';
    btn.classList.add('primary');
    paper.style.outline = '2px dashed var(--gold)';
    paper.focus();
  }else{
    btn.textContent = '✏️ 직접 수정';
    btn.classList.remove('primary');
    paper.style.outline = 'none';
  }
}

function agendaListGa(){ // 가) 나) 다) + 마지막 기타.
  const KA = ['가','나','다','라','마','바','사','아','자','차','카','타','파','하'];
  const items = realAgendas().map((a,i)=>`<div class="indent">${KA[i]||i+1}) ${esc(a.name)}</div>`).join('');
  const etcIdx = realAgendas().length;
  return items + `<div class="indent">${KA[etcIdx]||etcIdx+1}) 기타.</div>`;
}
function agendaListNum(){ // 1) 2) 3) + 기타.
  const items = realAgendas().map((a,i)=>`<div class="indent2">${i+1}) ${esc(a.name)}</div>`).join('');
  return items + `<div class="indent2">${realAgendas().length+1}) 기타.</div>`;
}
function agendaTable(withResult){
  const real = realAgendas();
  // 결과 문서(심의결과 표)에는 회기 결정의 건을 1번으로 포함
  const sessionRow = {name:`제${S.round||'○'}회 학교운영위원회 ${S.mtype} 회기 결정의 건`, dept:'-', result:'원안 가결'};
  const list = withResult && S.useSession!==false ? [sessionRow, ...real] : real;
  const rows = list.length ? list : [{name:'',dept:'',result:''}];
  return `<table class="doc"><tr><th style="width:20mm; white-space:nowrap;">안건번호</th><th>안 건 명</th><th style="width:28mm">제안부서</th>${withResult?'<th style="width:26mm">심의결과</th>':''}</tr>

}

  return `<div class="footer">
    <span>담당자 ${bl(S.chargeName)}</span>　　　　　　　<span>간사 ${bl(S.secName)}</span>　　　　　　　<span>위원장 ${bl(chair())}</span><br>

    전화 ${bl(S.tel)} 전송 ${bl(S.fax)} / ${S.email?esc(S.email):''} / ${esc(S.open)}
  </div>`;
}

function uploadExcel(e, kind){
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const wb = XLSX.read(r.result, {type:'array'});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
      const data = rows.map(row => row.map(c => String(c).trim())).filter(row => row.some(c => c));
      if(!data.length){ alert('엑셀에 내용이 없어요. 양식에 적었는지 확인해 주세요.'); return; }
      // 첫 행이 헤더(제목행)이면 제외
      const head = data[0].join('');
      const body = (/안건|성명|구분|이름|연번|번호/.test(head)) ? data.slice(1) : data;
      if(kind === 'agenda'){
        const items = body.map(row => {
          // 첫 칸이 숫자(연번)면 한 칸 밀기
          const off = /^\d+$/.test(row[0]) ? 1 : 0;
          return agendaFromRow(row, off);
        }).filter(a => a.name);
        if(!items.length){ alert('안건명 열을 찾지 못했어요. 「⬇ 양식 받기」로 받은 양식인지 확인해 주세요.'); return; }
        S.agendas = items;
        alert(`안건 ${items.length}건을 불러왔어요.`);
      }else{
        const items = body.map(row => {
          const off = /^\d+$/.test(row[0]) ? 1 : 0;
          return {type: row[off]||'교원위원', name: row[off+1]||'', email: row[off+2]||'', note: row[off+3]||'', attend:true};
        }).filter(m => m.name);
        if(!items.length){ alert('위원 성명 열을 찾지 못했어요. 「⬇ 양식 받기」로 받은 양식인지 확인해 주세요.'); return; }
        S.members = items;
        alert(`위원 ${items.length}명을 불러왔어요.`);
      }
      render();
    }catch(err){ alert('엑셀을 읽지 못했어요. xlsx 파일인지 확인해 주세요. (' + err.message + ')'); }
  };
  r.readAsArrayBuffer(file);
  e.target.value = '';
}
// 안건 엑셀 한 줄: 안건명 | 제안부서 | 발언내용 | 찬성 | 반대 | 결정 | 보고사항 | 설명자
function agendaFromRow(row, off){
  const c = k => String(row[off+k]||'').trim();
  const res = c(5);
  return {name:c(0), dept:c(1), speak:c(2), yes:c(3), no:c(4), result: RESULTS.includes(res) ? res : '', etc:c(6), presenter:c(7)};
}
function dlSheet(rows, name, fname){
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = rows[0].map((_,i)=>({wch: i===1?40:14}));
  XLSX.utils.book_append_sheet(wb, ws, name);
  XLSX.writeFile(wb, fname);
}

function toISO(v){ // 엑셀 날짜(Date/직렬번호/문자열) → yyyy-mm-dd
  if(v === '' || v == null) return '';
  if(v instanceof Date && !isNaN(v)){
    return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  }
  if(typeof v === 'number'){
    const d = new Date(Date.UTC(1899,11,30) + Math.round(v)*86400000);
    return d.toISOString().slice(0,10);
  }
  const s = String(v).trim().replace(/[.\/]/g,'-').replace(/-+$/,'');
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : s;
}
function toHM(v){ // 엑셀 시간(Date/소수/문자열) → HH:MM
  if(v === '' || v == null) return '';
  if(v instanceof Date && !isNaN(v)){
    return `${String(v.getHours()).padStart(2,'0')}:${String(v.getMinutes()).padStart(2,'0')}`;
  }
  if(typeof v === 'number'){ // 0~1 소수 = 하루 중 시각
    const mins = Math.round((v % 1) * 24 * 60);
    return `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`;
  }
  const s = String(v).trim();
  const m = s.match(/(\d{1,2}):(\d{2})/);
  return m ? `${m[1].padStart(2,'0')}:${m[2]}` : s;
}
function uploadAll(e){
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();

      const wb = XLSX.read(r.result, {type:'array'});
      const pick = re => wb.SheetNames.find(n => re.test(n));
      const rowsOf = n => n ? XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, defval:''})
                              .filter(row => row.some(c => String(c).trim())) : [];
      let cntF = 0, cntA = 0, cntM = 0;

      // 1) 기본정보 (항목 | 값)
      rowsOf(pick(/기본|정보|설정/)).forEach(row => {
        const label = String(row[0]).trim(), val = row[1];
        const key = FIELD_MAP[label];
        if(!key || val === '' || val == null) return;
        if(key === 'mdate' || key === 'sendDate' || key === 'resultDate') S[key] = toISO(val);
        else if(key === 'mtime' || key === 'endTime') S[key] = toHM(val);
        else if(key === 'useSession') S.useSession = !/^(빼기|뺌|제외|아니오|아니요|n|no|x|false|0)$/i.test(String(val).trim());
        else S[key] = String(val).trim();
        cntF++;
      });

      // 2) 안건 (안건명 | 제안부서)
      const ar = rowsOf(pick(/안건/));
      if(ar.length){
        const body = /안건|번호|연번/.test(ar[0].join('')) ? ar.slice(1) : ar;
        const items = body.map(row => {
          const off = /^\d+$/.test(String(row[0]).trim()) ? 1 : 0;

        }).filter(a => a.name);
        if(items.length){ S.agendas = items; cntA = items.length; }
      }

      // 3) 위원명단 (구분 | 성명 | 이메일 | 비고)
      const mr = rowsOf(pick(/위원|명단/));
      if(mr.length){
        const body = /구분|성명|이름|연번/.test(mr[0].join('')) ? mr.slice(1) : mr;
        const items = body.map(row => {
          const off = /^\d+$/.test(String(row[0]).trim()) ? 1 : 0;

                  email:String(row[off+2]||'').trim(), note:String(row[off+3]||'').trim(), attend:true};
        }).filter(m => m.name);
        if(items.length){ S.members = items; cntM = items.length; }
      }

      if(!cntF && !cntA && !cntM){ alert('읽을 내용이 없어요. 「⬇ 양식 받기」로 받은 양식에 적었는지 확인해 주세요.'); return; }
      render();
      alert(`불러오기 완료\n· 기본정보 ${cntF}개 항목\n· 안건 ${cntA}건\n· 위원 ${cntM}명`);
    }catch(err){ alert('엑셀을 읽지 못했어요. xlsx 파일인지 확인해 주세요. (' + err.message + ')'); }
  };

}

/* ================= 한글(HWPX) 저장 =================
   미리보기 용지(.paper)에 보이는 칸(td·격자 div)의 화면 위치를 재서 한글 표 하나로 합친다.
   - 위아래로 맞붙은 표·격자는 하나의 표로 합침 (선 위치를 모아 행·열 격자를 만들고 병합 칸으로 배치)
   - 미리보기에서 직접 고친 내용(contenteditable)도 그대로 들어감
   - 용지 1장 = 한글 1쪽 (다음 용지는 쪽 나눔)
   - zip 은 압축 없이(STORE) 직접 묶음 — 외부 라이브러리 없음
   사용: saveHwpx('content','파일이름') — 법인회계Master 와 같은 코드 */
const HWPX={
  PAGE_W:59528,PAGE_H:84188,                 // A4 (HWPUNIT: 1mm ≈ 283.46)
  MARGIN:{left:4252,right:4252,top:4252,bottom:4252}, // 인쇄 여백 15mm (@page 와 같게)
  FONT:'함초롬바탕',
  SNAP:3,                                     // 이 픽셀 이내의 선은 같은 선으로 봄
  NOPRINT:'.no-print,.noprint'
};
function hwpxEsc(s){return String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hwpxColor(css){ // 'rgb(242, 242, 242)' → '#F2F2F2' (투명·흰색이면 null)
  const m=String(css).match(/rgba?\(([^)]+)\)/);if(!m)return null;
  const v=m[1].split(',').map(x=>parseFloat(x));
  if(v.length>3&&v[3]===0)return null;
  if(v[0]>=254&&v[1]>=254&&v[2]>=254)return null;
  return '#'+v.slice(0,3).map(n=>Math.round(n).toString(16).padStart(2,'0')).join('').toUpperCase();
}
function hwpxAlign(el,cs){
  if(cs.position==='absolute'&&el.parentElement){ // 따로 띄운 글(예: 적요 칸 오른쪽 금액)은 가까운 쪽으로 정렬
    const r=el.getBoundingClientRect(),pr=el.parentElement.getBoundingClientRect();
    if(pr.right-r.right<r.left-pr.left)return 'RIGHT';
  }
  if(cs.display==='flex'||cs.display==='grid'){
    if(cs.justifyContent==='center')return 'CENTER';
    if(/end|right/.test(cs.justifyContent))return 'RIGHT';
  }
  const t=cs.textAlign;
  if(t==='center'||t==='-webkit-center')return 'CENTER';
  if(t==='right'||t==='end'||t==='-webkit-right')return 'RIGHT';
  if(t==='justify')return 'JUSTIFY';
  return 'LEFT';
}
function hwpxHidden(el){const cs=getComputedStyle(el);return cs.display==='none'||cs.visibility==='hidden'||el.matches(HWPX.NOPRINT);}
/* 요소 안의 글을 문단 목록으로 — 자식이 모두 블록이면 자식마다(정렬·글자크기 각자), 아니면 줄 단위 */
function hwpxParas(el){
  if(hwpxHidden(el))return [];
  const kids=[...el.childNodes];
  const elKids=kids.filter(n=>n.nodeType===1&&!hwpxHidden(n));
  const directText=kids.some(n=>n.nodeType===3&&n.textContent.trim());
  const allBlock=elKids.length>0&&!directText&&elKids.every(k=>k.tagName!=='BR'&&!/^inline/.test(getComputedStyle(k).display));
  if(allBlock)return elKids.flatMap(hwpxParas);
  const cs=getComputedStyle(el);
  const lines=(el.innerText||'').replace(/ /g,' ').replace(/\r/g,'').split('\n');
  while(lines.length&&!lines[0].trim())lines.shift();
  while(lines.length&&!lines[lines.length-1].trim())lines.pop();
  const pt=parseFloat(cs.fontSize)*0.75, bold=(parseInt(cs.fontWeight,10)||400)>=600, align=hwpxAlign(el,cs);
  const lh=parseFloat(cs.lineHeight)/parseFloat(cs.fontSize);           // 'normal'이면 NaN
  const ls=isNaN(lh)?130:Math.min(300,Math.max(100,Math.round(lh*100)));
  return lines.map(t=>({text:t,pt,bold,align,ls}));
}
function hwpxBordered(el){const cs=getComputedStyle(el);return ['Top','Right','Bottom','Left'].some(s=>hwpxSide(cs,s));}
function hwpxVisKids(el){return [...el.children].filter(k=>!hwpxHidden(k)&&k.getBoundingClientRect().width>0);}
/* 가로 줄(flex row) 안에 글 상자가 2개 이상 — 칸으로 나눠 위치를 살림 (예: "년도 법인회계 … 증제 1 호", 감사 서명줄, 표지 세입·세출 상자) */
function hwpxFlexRow(el){
  const cs=getComputedStyle(el);
  if(!/flex/.test(cs.display)||!/^row/.test(cs.flexDirection))return false;
  if([...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim()))return false;
  const kids=hwpxVisKids(el);
  return kids.length>=2&&kids.every(k=>k.tagName!=='TABLE'&&!k.querySelector('table'));
}
/* 이 요소(또는 안쪽)에 표처럼 다뤄야 할 것이 있나: 표·격자·가로 줄·테두리 상자 */
function hwpxHasBoxes(el){
  if(el.querySelector('table'))return true;
  return [...el.querySelectorAll('*')].some(d=>!hwpxHidden(d)&&(getComputedStyle(d).display==='grid'||hwpxFlexRow(d)||hwpxBordered(d)));
}
/* 용지 한 장을 블록 목록으로: {type:'boxes',boxes:[...]} 또는 {type:'text',el} (화면 순서) */
function hwpxBlocks(paper){
  const out=[];
  const addBoxes=(list)=>{
    if(!list.length)return;
    const top=Math.min(...list.map(b=>b.rect.top)),bottom=Math.max(...list.map(b=>b.rect.bottom));
    const last=out[out.length-1];
    if(last&&last.type==='boxes'&&top<=last.bottom+HWPX.SNAP){last.boxes.push(...list);last.bottom=Math.max(last.bottom,bottom);last.top=Math.min(last.top,top);}
    else out.push({type:'boxes',boxes:list,top,bottom});
  };
  const box=(el)=>({el,rect:el.getBoundingClientRect()});
  const walk=(node)=>{
    for(const ch of node.children){
      if(hwpxHidden(ch))continue;
      const r=ch.getBoundingClientRect();if(!(r.width>0&&r.height>0))continue;
      const cs=getComputedStyle(ch);
      if(ch.tagName==='TABLE'){
        const list=[];
        for(const row of ch.rows)for(const cell of row.cells){const cr=cell.getBoundingClientRect();if(cr.width>0&&cr.height>0)list.push(box(cell));}
        addBoxes(list);
      }else if(cs.display==='grid'||hwpxFlexRow(ch)){
        const kids=hwpxVisKids(ch).map(box);
        if(cs.display!=='grid'&&!hwpxBordered(ch)&&!kids.some(k=>hwpxBordered(k.el))){
          // 테두리 없는 가로 줄: 글 사이 빈 공간을 반씩 나눠 칸을 넓힘(한글에서 줄바꿈 방지),
          // 원래 글이 붙어 있던 쪽으로 정렬해 위치 유지
          kids.sort((a,b)=>a.rect.left-b.rect.left);
          const orig=kids.map(k=>({l:k.rect.left,rt:k.rect.right}));
          kids.forEach((k,i)=>{
            const L=i===0?r.left:(orig[i-1].rt+orig[i].l)/2;
            const R=i===kids.length-1?r.right:(orig[i].rt+orig[i+1].l)/2;
            const dl=orig[i].l-L,dr=R-orig[i].rt;
            k.align=Math.abs(dl-dr)<4?'CENTER':(dl<dr?'LEFT':'RIGHT');
            k.rect={left:L,right:R,top:r.top,bottom:r.bottom};
          });
        }
        addBoxes(kids);
      }else if(hwpxBordered(ch)&&!ch.querySelector('table')&&![...ch.querySelectorAll('*')].some(d=>!hwpxHidden(d)&&(getComputedStyle(d).display==='grid'||hwpxFlexRow(d)))){
        addBoxes([box(ch)]);                         // 테두리 있는 상자 하나 = 칸 하나
      }else if(hwpxHasBoxes(ch)){
        walk(ch);
      }else if((ch.innerText||'').trim()){
        const kids=hwpxVisKids(ch);
        const direct=[...ch.childNodes].some(n=>n.nodeType===3&&n.textContent.trim());
        if(kids.length>1&&!direct&&kids.every(k=>!/^inline/.test(getComputedStyle(k).display)))walk(ch); // 블록이 여러 개면 하나씩(사이 간격 살림)
        else out.push({type:'text',el:ch,top:r.top,bottom:r.bottom});
      }
    }
  };
  walk(paper);
  return out;
}
/* 선 위치 모으기: 가까운 값끼리 합쳐 정렬된 선 목록 */
function hwpxLines(vals){
  const s=[...vals].sort((a,b)=>a-b),lines=[];
  for(const v of s){if(!lines.length||v-lines[lines.length-1]>HWPX.SNAP)lines.push(v);}
  return lines;
}
function hwpxIdx(lines,v){let bi=0,bd=Infinity;lines.forEach((x,i)=>{const d=Math.abs(x-v);if(d<bd){bd=d;bi=i;}});return bi;}
function hwpxSide(cs,side){return parseFloat(cs['border'+side+'Width'])>0.3&&cs['border'+side+'Style']!=='none'&&cs['border'+side+'Style']!=='hidden';}

/* 입력칸(input·select·textarea)의 값은 글로 읽히지 않으므로, 잠깐 같은 자리에 글(span)로 바꿔 놓고 변환한 뒤 되돌림 */
function hwpxBuild(papers){
  const swaps=[];
  papers.forEach(p=>p.querySelectorAll('input,select,textarea').forEach(c=>{
    if(hwpxHidden(c)||c.type==='hidden'||c.type==='file')return;
    const v=(c.type==='checkbox'||c.type==='radio')?(c.checked?'☑':'☐'):c.tagName==='SELECT'?((c.options[c.selectedIndex]||{}).text||''):c.value;
    const sp=document.createElement('span');sp.textContent=v||'　';sp.style.whiteSpace='pre-wrap';
    c.after(sp);swaps.push([c,sp,c.style.display]);c.style.display='none';
  }));
  try{return hwpxBuildCore(papers);}
  finally{swaps.forEach(([c,sp,d])=>{sp.remove();c.style.display=d;});}
}
function hwpxBuildCore(papers){
  const charPrs=[],charIds={},paraPrs=[],paraIds={},bfs=[],bfIds={};
  const charId=(pt,bold)=>{const h=Math.max(100,Math.round(pt*100)),k=h+'|'+(bold?1:0);if(!(k in charIds)){charIds[k]=charPrs.length;charPrs.push({h,bold});}return charIds[k];};
  const paraId=(align,ls,left=0,right=0,prev=0)=>{const k=[align,ls,left,right,prev].join('|');if(!(k in paraIds)){paraIds[k]=paraPrs.length;paraPrs.push({align,ls,left,right,prev});}return paraIds[k];};

  const tinyChar=charId(1,false),tinyPara=paraId('LEFT',100); // 쪽 설정만 싣는 빈 문단용

  const paraXml=(p,ls,ind)=>`<hp:p paraPrIDRef="${paraId(p.align,ls,ind?ind.left:0,ind?ind.right:0,ind?ind.prev:0)}" styleIDRef="0"><hp:run charPrIDRef="${charId(p.pt,p.bold)}"><hp:t>${hwpxEsc(p.text)}</hp:t></hp:run></hp:p>`;

/* 압축 없는(STORE) zip — mimetype 이 맨 앞이어야 한글이 HWPX 로 인식 */
function hwpxZip(files){
  const enc=new TextEncoder();
  const crcT=hwpxZip.t||(hwpxZip.t=Array.from({length:256},(_,n)=>{let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0;}));
  const crc=(d)=>{let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=crcT[(c^d[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};

  const u16=(v)=>[v&0xFF,(v>>>8)&0xFF],u32=(v)=>[v&0xFF,(v>>>8)&0xFF,(v>>>16)&0xFF,(v>>>24)&0xFF];
  for(const [name,text] of files){
    const nm=enc.encode(name),data=typeof text==='string'?enc.encode(text):text,c=crc(data);
    const common=[...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(data.length),...u32(data.length),...u16(nm.length),...u16(0)];
    const local=new Uint8Array([...u32(0x04034b50),...common]);
    parts.push(local,nm,data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...common,...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=local.length+nm.length+data.length;
  }
  const cdSize=central.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,end],{type:'application/hwp+zip'});
}
function saveHwpx(hostId,fileBase){

    parts.forEach(([cp, s], i) => {
      let r;

    });

  }

  function drop(n) { if (n && n.parentNode) n.parentNode.removeChild(n); }
  function stripLayout(doc) { Array.from(doc.getElementsByTagName('hp:linesegarray')).forEach(drop); }

  function fill(root, dict) {
    Array.from(root.getElementsByTagName('hp:t')).forEach(t => {
      const s = t.textContent;

})();

   틀(HWPT_TPL)은 실제 학운위 한글 문서에서 학교·이름을 지우고 {{칸}}만 남긴 것.
   안건·위원 수만큼 문단·표 줄을 늘려 원본 모양(글꼴·표·결재란) 그대로 만든다. 틀이 없는 문서는 아래 화면 변환 방식(saveHwpx)을 씀 */
const HWPT_DOC = {d2:'tongbo', d3:'gonggo', d5:'bangmyeong', d6:'cover', d7:'minutes', sc:'scenario'};
const HWPT_KA = ['가','나','다','라','마','바','사','아','자','차','카','타','파','하'];
const HWPT_DEL = '⟪지움⟫';
async function hwptInflate(b64){
  const bin = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  const st = new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
function hwptDate(iso){ const d = D(iso); return d ? {y:d.getFullYear(), m:d.getMonth()+1, d:d.getDate(), w:WD[d.getDay()], wf:WDF[d.getDay()]} : null; }
function hwptVote(a){ return {yes: a.yes!=='' && a.yes!=null ? a.yes : attendMembers().length, no: a.no!=='' && a.no!=null ? a.no : '0'}; }
function hwptAsk(name, result){
  const r = result || '원안 가결';
  if(/수정/.test(r)) return [`${name}을(를) 수정하여 결정하고자 하는데 이의 있습니까?`, '이의가 없으므로 수정 가결되었음을 선포합니다.'];
  if(/조건부/.test(r)) return [`${name}을(를) 조건부로 결정하고자 하는데 이의 있습니까?`, '이의가 없으므로 조건부 가결되었음을 선포합니다.'];
  if(/부결/.test(r)) return [`${name}에 대하여 표결하겠습니다.`, '표결 결과 부결되었음을 선포합니다.'];
  if(/보류/.test(r)) return [`${name}은(는) 추가 검토를 위해 보류하고자 하는데 이의 있습니까?`, '이의가 없으므로 보류되었음을 선포합니다.'];
  return [`${name}을(를) 원안대로 결정하고자 하는데 이의 있습니까?`, '이의가 없으므로 가결되었음을 선포합니다.'];
}

function hwptItemDict(a, i){
  const v = hwptVote(a), name = a.name;
  const [ask, declare] = a.session ? [`본 회의의 회기를 ${S.sessionDays}일로 정하고자 하는데 이의 있습니까?`, `이의가 없으므로 회기를 ${S.sessionDays}일로 결정합니다.`] : hwptAsk(name, a.result);
  return {'a.no':i+1, 'a.ga':HWPT_KA[i]||i+1, 'a.name':name, 'a.result':a.session ? `${S.sessionDays}일로 결정` : (a.result||'원안 가결'),
    'a.yes':v.yes, 'a.no2':v.no, 'a.etc':a.etc ? a.etc : HWPT_DEL, 'a.attach':a.attach || name,
    'a.presenter':a.presenter || S.scPresenter || '담당자', 'a.ask':ask, 'a.declare':declare};
}
function hwptBuild(key, doc){
  const H = HT, base = hwptDict(key);
  const firstP = re => H.findP(doc, re);
  const rep = (re, items, extra) => H.repeat(firstP(re), items, (a,i,cl)=>{ const d = Object.assign({}, base, hwptItemDict(a,i)); if(extra) extra(a,i,cl,d); return d; });
  const real = realAgendas();
  if(key==='gonggo'){ rep(/\{\{a\.ga\}\}/, real); base.etcGa = HWPT_KA[real.length]||real.length+1; }
  if(key==='gonggoResult'){ rep(/\{\{a\.ga\}\}/, hwptItems(true)); }
  if(key==='tongbo'){ rep(/\{\{a\.no\}\}\)/, real); base.etcNo = real.length+1; }
  if(key==='tongboResult'){ rep(/\{\{a\.no\}\}\)/, hwptItems(true)); }
  if(key==='agenda'){
    const top = H.kids(doc.documentElement, 'hp:p'), blk = top.slice(0, -1);
    H.repeat(blk, real.length ? real : [{name:''}], (a,i,cl)=>{
      if(i>0){ cl[0].setAttribute('pageBreak','1'); ['hp:secPr','hp:ctrl'].forEach(n=>Array.from(cl[0].getElementsByTagName(n)).filter(e=>n!=='hp:ctrl'||e.getElementsByTagName('hp:colPr').length).forEach(H.drop)); }
      return Object.assign({}, base, hwptItemDict(a,i));
    });
  }
  if(key==='bangmyeong'){
    const mem = S.members.filter(m=>m.name).length ? S.members.filter(m=>m.name) : S.members;
    const tr = H.up(firstP(/\{\{m\.type\}\}/), 'hp:tr'), tbl = tr.parentNode;
    H.repeat(tr, mem, (m,i)=>Object.assign({}, base, {'m.type': i>0 && mem[i-1].type===m.type ? '〃' : m.type, 'm.name': (m.name||'').split('').join(' ')}));
    H.renumber(tbl);
  }
  if(key==='minutes'){
    const items = hwptItems(true);
    rep(/^ 제\{\{a\.no\}\}안/, items);
    const tr = H.up(firstP(/^\s+제\{\{a\.no\}\}안/), 'hp:tr'), tbl = tr.parentNode, tr2 = H.kids(tbl,'hp:tr')[H.kids(tbl,'hp:tr').indexOf(tr)+1];
    H.repeat([tr, tr2], items.length ? items : [{name:''}], (a,i,cl)=>{
      const lines = (a.speak||'').split('\n').map(s=>s.trim()).filter(Boolean);
      H.repeat(H.findP(cl[1], /\{\{s\.line\}\}/), lines, s=>({'s.line':s}));
      return Object.assign({}, base, hwptItemDict(a,i));
    });
    H.renumber(tbl);
    // 기타 사항: 줄마다 문단 하나
    const etc = (S.etcNote||'').split('\n').map(s=>s.trim()).filter(Boolean);
    H.repeat(firstP(/\{\{etcNote\}\}/), etc.length ? etc : [''], l=>({etcNote:l}));
  }
  if(key==='scenario'){
    const items = hwptItems(true);
    rep(/^\s+제\{\{a\.no\}\}안/, items);
    const otr = H.up(firstP(/\{\{r\.act\}\}/), 'hp:tr'), otbl = otr.parentNode;
    H.repeat(otr, S.scRows.filter(r=>r.act), r=>Object.assign({}, base, {'r.min': r.min ? `(${r.min}분)` : '', 'r.act':r.act, 'r.who':r.who}));
    H.renumber(otbl);
    rep(/^제\{\{a\.no\}\}안/, items);
    base.cnt = items.length;
    const at = H.up(firstP(/^의안 \{\{a\.no\}\}호$/), 'hp:tbl');
    H.repeat(at, items.length ? items : [{name:''}], (a,i,cl)=>{
      if(a.session){ // 회기 결정: 안건설명·질의답변 줄 빼기
        const R = H.kids(cl[0],'hp:tr'), s = R.findIndex(r=>/안건설명/.test(H.txt(H.allP(r)[0]||r))), e = R.findIndex(r=>H.allP(r).some(p=>/^의결$/.test(H.txt(p))));
        if(s>0 && e>s){ R.slice(s, e).forEach(H.drop); H.renumber(cl[0]); }
      }
      return Object.assign({}, base, hwptItemDict(a,i));
    });
  }
  H.fill(doc, base);
  // 빈 보고사항 등 지울 문단
  H.findAllP(doc, new RegExp(HWPT_DEL)).forEach(H.drop);
  H.reid(doc);
}
async function hwptMake(key){
  const files = [];
  for(const [rel, b64] of HWPT_TPL[key]) files.push([rel, await hwptInflate(b64)]);
  const sec = files.find(f=>f[0]==='Contents/section0.xml');
  const doc = new DOMParser().parseFromString(new TextDecoder().decode(sec[1]), 'application/xml');
  hwptBuild(key, doc);
  let xml = new XMLSerializer().serializeToString(doc);
  if(!/^<\?xml/.test(xml)) xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes" ?>' + xml;
  sec[1] = xml;
  files.sort((a,b)=> (a[0]==='mimetype' ? -1 : b[0]==='mimetype' ? 1 : 0));
  return hwpxZip(files);
}
async function saveHwpt(key, fileBase){
  let blob;
  try{ blob = await hwptMake(key); }
  catch(e){ console.error(e); alert('한글 파일을 만드는 중 문제가 생겼어요. [🖨 인쇄 / PDF 저장]을 이용해 주세요.\n('+e.message+')'); return; }
  const name = String(fileBase||'문서').replace(/[\\/:*?"<>|]/g,'_') + '.hwpx';
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

    </table>
    <div style="text-align:center; font-size:20pt; font-weight:700; margin:16mm 0 4mm;">${v.school}</div>
    <div style="text-align:center; font-size:22pt; font-weight:800; letter-spacing:.6em; margin-bottom:8mm; break-after:page; page-break-after:always;">회 의 진 행</div>
    ${tbl(grp('인사말씀', [[`바쁘신 중에도 ${v.school} 운영위원회에 참석해 주신 위원님들께 진심으로 감사드립니다.<br>그럼 지금부터 제${v.round}회 운영위원회를 시작하도록 하겠습니다.`]])
      + grp('개회선언', [[`${v.school} 총 ${v.total}분의 위원님 중 ( ${v.att} )분이 참석하여 성원이 되었으므로 개회를 선언합니다`], sound])
      + grp('안건채택', [[`다음은 ${v.year}학년도 제${v.round}회 ${v.school} 운영위원회 심의 안건을 채택하고자 합니다.`],
        [`안건 내용은 배부해 드린 회의자료와 같이<br><span style="font-weight:400">${items.map((a,i)=>`제${i+1}안 ${esc(a.name)}`).join('<br>')}</span><br>심의안건으로 채택하고자 하는데 이의 있습니까?`],
        ["‘없습니다’ 라고 하는 위원 있음", red], [`이의가 없으므로 오늘 심의안건 ${items.length}건으로 채택되었습니다.`], sound]))}
    ${items.map(agendaTbl).join('')}
    ${tbl(grp('폐회', [[`${v.school} 운영위원회 업무를 위하여 참석해 주신 위원님들께 다시 한번 감사를 드리며 늘 건강하시고 행복하시기를 기원합니다.`], [`이상으로 ${v.year}학년도 제${v.round}회 ${v.school} 운영위원회를 모두 마치겠습니다.`], ['폐회를 선언합니다.'], sound]))}
    </div>`;
  },
});
