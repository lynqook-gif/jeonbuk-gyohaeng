<head>
<meta charset="UTF-8">

<title>학교운영위원회 자동서식 프로그램</title>

<style>
:root{
  --navy:#14273f; --navy2:#1e3a5f; --navy3:#2c4f7c; --gold:#c9a227;
  --line:#d7dde6; --bg:#eef1f5; --paper:#ffffff; --ink:#1a1a1a; --muted:#6b7684;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Malgun Gothic','Noto Sans KR',sans-serif; background:var(--bg); color:var(--ink);}
.app{display:flex; min-height:100vh;}
.sidebar{width:230px; background:var(--navy); color:#fff; flex-shrink:0; display:flex; flex-direction:column;}
.sidebar .brand{padding:20px 18px 14px; border-bottom:1px solid rgba(255,255,255,.15);}
.sidebar .brand h1{font-size:16px; font-weight:700; line-height:1.4;}
.sidebar .brand p{font-size:11px; color:#aebbd0; margin-top:4px;}
.nav{flex:1; overflow-y:auto; padding:10px 0;}
.nav button{display:block; width:100%; text-align:left; background:none; border:none; color:#c6d2e2;
  padding:9px 18px; font-size:13px; cursor:pointer; font-family:inherit; border-left:3px solid transparent;}
.nav button:hover{background:rgba(255,255,255,.07); color:#fff;}
.nav button.active{background:rgba(255,255,255,.12); color:#fff; border-left-color:var(--gold); font-weight:700;}
.nav .sec{padding:12px 18px 5px; font-size:10.5px; letter-spacing:.12em; color:#7e90a9; font-weight:700;}
.sidebar .foot{padding:12px 18px; font-size:10.5px; color:#7e90a9; border-top:1px solid rgba(255,255,255,.15);}
.main{flex:1; display:flex; flex-direction:column; min-width:0;}
.toolbar{background:#fff; border-bottom:2px solid var(--navy); padding:10px 22px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.toolbar .title{font-size:15px; font-weight:700; color:var(--navy); margin-right:auto;}
.btn{border:1px solid var(--navy2); background:#fff; color:var(--navy2); padding:7px 14px; border-radius:4px;
  font-size:12.5px; cursor:pointer; font-family:inherit; font-weight:600;}
.btn:hover{background:var(--navy2); color:#fff;}
.btn.primary{background:var(--navy2); color:#fff;}
.btn.primary:hover{background:var(--navy);}
.btn.sm{padding:3px 9px; font-size:11.5px;}
.content{flex:1; overflow-y:auto; padding:24px;}

.card{background:#fff; border:1px solid var(--line); border-radius:6px; margin-bottom:18px; overflow:hidden;}
.card h2{background:var(--navy2); color:#fff; font-size:13.5px; padding:9px 16px; font-weight:700;}
.card h2 .hint{font-weight:400; font-size:11px; color:#c6d2e2; margin-left:8px;}
.card .body{padding:16px;}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px;}
.fld label{display:block; font-size:11.5px; color:var(--muted); font-weight:700; margin-bottom:4px;}
.fld input,.fld select,.fld textarea{width:100%; border:1px solid var(--line); border-radius:4px; padding:7px 9px; font-size:13px; font-family:inherit;}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none; border-color:var(--navy3);}
.fld .auto{background:#f4f7fb; color:var(--navy2); font-weight:600;}
table.edit{width:100%; border-collapse:collapse; font-size:12.5px;}
table.edit th{background:#f2f5f9; border:1px solid var(--line); padding:6px; color:var(--navy); font-size:11.5px;}
table.edit td{border:1px solid var(--line); padding:3px;}
table.edit td input, table.edit td select, table.edit td textarea{width:100%; border:none; padding:5px 6px; font-size:12.5px; font-family:inherit; background:transparent; resize:vertical;}
table.edit td input:focus, table.edit td select:focus, table.edit td textarea:focus{outline:2px solid var(--navy3); outline-offset:-2px; background:#fff;}
table.edit .num{width:34px; text-align:center; color:var(--muted);}
table.edit .del{width:36px; text-align:center;}
table.edit .chk{width:44px; text-align:center;}
.xbtn{border:none; background:none; color:#b23b3b; cursor:pointer; font-size:14px; padding:2px 6px;}
.xbtn:hover{background:#fbeaea; border-radius:3px;}
.addrow{margin-top:8px;}
.note{font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.5;}
.agenda-detail{background:#f8fafc; border:1px solid var(--line); border-radius:5px; padding:12px; margin-bottom:10px;}
.agenda-detail .hd{font-weight:700; font-size:13px; color:var(--navy); margin-bottom:8px; display:flex; align-items:center; gap:8px;}
.agenda-detail .dgrid{display:grid; grid-template-columns:1fr 90px 90px 140px; gap:8px; margin-top:8px;}
@media(max-width:800px){.agenda-detail .dgrid{grid-template-columns:1fr 1fr;}}

.paper-wrap{display:flex; justify-content:center;}
.paper{width:210mm; min-height:297mm; background:var(--paper); box-shadow:0 2px 14px rgba(20,39,63,.18);
  padding:20mm 20mm; font-family:'Batang','Noto Serif KR',serif; font-size:12pt; line-height:1.7; color:#111;}
.paper .org{font-size:20pt; font-weight:700; letter-spacing:.12em; text-align:center; margin-bottom:6mm;}
.paper .doc-title{font-size:16pt; font-weight:700; text-align:center; margin:8mm 0 6mm; letter-spacing:.04em;}
.paper .row{display:flex; margin:1mm 0;}
.paper .row .lab{width:20mm; font-weight:700; flex-shrink:0;}
.paper table.doc{width:100%; border-collapse:collapse; margin:4mm 0; font-size:11pt;}
.paper table.doc th{border:1.5px solid #000; background:#f0f0f0; padding:2mm; font-weight:700;}
.paper table.doc td{border:1px solid #000; padding:2mm; text-align:center;}
.paper table.doc td.l{text-align:left;}
.paper .sign{text-align:center; font-size:16pt; font-weight:700; letter-spacing:.25em; margin:12mm 0 8mm;}
.paper .footer{border-top:1.5px solid #000; margin-top:10mm; padding-top:2mm; font-size:9.5pt; line-height:1.7; font-family:'Malgun Gothic',sans-serif;}
.paper .indent{padding-left:8mm;}
.paper .indent2{padding-left:14mm;}
.blank{color:#bbb;}
.minutes h3{font-size:12pt; margin:4mm 0 1mm; font-weight:700;}
.minutes p{margin:.5mm 0;}
.mrec-body{line-height:1.4;}
.mrec-body p{margin:.3mm 0; line-height:1.4;}
.sc-doc{font-size:13pt; line-height:1.9;}
.sc-doc .sc-tbl{font-size:12.5pt;}
.sc-doc .sc-tbl th{background:#eef1f5; white-space:nowrap;}
.sc-doc .sc-tbl td{text-align:left; line-height:1.85; padding:2.5mm;}
.sc-doc .indent{padding-left:8mm; margin:.5mm 0;}
.rec-doc{font-size:12.5pt; line-height:1.8;}
.rec-doc .org{font-size:20pt; font-weight:700; letter-spacing:.12em; text-align:center; margin-bottom:8mm;}
.rec-doc .rec-tbl{margin:4mm 0; table-layout:fixed;}
.rec-doc .rec-tbl th{background:#f0f0f0;}
.rec-doc .rec-tbl td{padding:2mm; word-break:break-all;}
.no-print{}
@media print{ .no-print{display:none !important;} }

@media print{
  body{background:#fff;}
  .sidebar,.toolbar{display:none !important;}
  .content{padding:0; overflow:visible;}
  .paper{box-shadow:none; width:auto; min-height:auto; padding:0;}
  .paper-wrap{display:block;}
  .no-print{display:none !important;}
  /* 페이지 분할: 행·문단 중간에서 잘리지 않게 */
  table.doc tr{ break-inside:avoid; page-break-inside:avoid; }
  table.doc tr.flow-row{ break-inside:auto; page-break-inside:auto; }
  .minutes p, .sc-doc p{ break-inside:avoid; page-break-inside:avoid; }
  .sc-tbl{ break-inside:auto; }
  thead{ display:table-header-group; }
  @page{size:A4; margin:15mm;}
}
@media(max-width:900px){
  .app{flex-direction:column;}
  .sidebar{width:100%;}
  .paper{width:100%; padding:10mm;}
}
</style>

<body>
<div class="app">

</div>

<script>
/* ───────────── 상태 (기본값 = 배포용 중립 예시) ───────────── */
const MEMBER_TYPES = ['위원장','부위원장','교원위원','학부모위원','지역위원','당연직(교장)'];
const RESULTS = ['','원안 가결','수정 가결','부결','보류','조건부 가결'];

let S = {
  school:'○○학교',
  zip:'',
  addr:'',

  // 시나리오 진행자 (인라인 입력)

  scRows:[
    {min:'1', act:'개 회', who:'교무부장'},

    {min:'', act:'폐 회', who:''},
  ],
  // 개방이사 추천 (인라인 입력, 개인정보라 저장 안 함)
  recLawArt:'사립학교법 제14조 4항, 정관 제20조 4',
  recCount:'3',
  recList:[
    {name:'', birth:'', role:'운영위원장', addr:''},
    {name:'', birth:'', role:'지역위원', addr:''},
    {name:'', birth:'', role:'학부모위원', addr:''},
  ],
  members:[
    {type:'위원장', name:'', email:'', note:'', attend:true},
    {type:'교원위원', name:'', email:'', note:'', attend:true},
    {type:'교원위원', name:'', email:'', note:'', attend:true},
    {type:'학부모위원', name:'', email:'', note:'', attend:true},
    {type:'학부모위원', name:'', email:'', note:'', attend:true},
    {type:'지역위원', name:'', email:'', note:'', attend:true},
  ],
  agendas:[
    {name:'', dept:'행정실', result:'', speak:'', yes:'', no:'', etc:''},
  ],
};

/* ───────────── 유틸 ───────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const bl = (v, ph) => v ? esc(v) : `<span class="blank">${ph||'　　'}</span>`;
const WD = ['일','월','화','수','목','금','토'];
const WDF = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
function D(iso){ if(!iso) return null; const d = new Date(iso+'T00:00:00'); return isNaN(d)?null:d; }
function fmtK(iso, full){ // 2026년 6월 25일(목) / (목요일)
  const d = D(iso); if(!d) return '';
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일(${full?WDF[d.getDay()]:WD[d.getDay()]})`;
}
function fmtDot(iso){ const d = D(iso); if(!d) return ''; return `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')}.`; }
function fmtDotShort(iso){ const d = D(iso); if(!d) return ''; return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}.`; }
const council = () => S.school + '운영위원회';
const roundYr = () => `${S.year}학년도 제${S.round||'○'}회`;
const roundHoe = () => `제${S.round||'○'}회 ${council()}`;
const chair = () => { const m = S.members.find(m=>m.type==='위원장'); return m && m.name ? m.name : ''; };
// 이름 가운데 글자 O 처리 (2자: 뒤글자O, 3자↑: 가운데 전부O). 한글 이름만, 직위/직함은 건드리지 않음
function maskName(name){
  if(!name) return name;
  const n = String(name).trim();
  if(n.length === 2) return n[0] + '○';
  if(n.length >= 3) return n[0] + '○'.repeat(n.length-2) + n[n.length-1];
  return n;
}
const mn = name => S.maskNames ? maskName(name) : name;
// 문장 속 이름 마스킹: "유삼석 위원장님", "담당자 박지은" 등에서 등록된 위원/담당자/간사 이름만 치환
function maskInText(text){
  if(!S.maskNames || !text) return text;
  let t = text;
  const names = [...S.members.map(m=>m.name), S.chargeName, S.secName].filter(x=>x && x.length>=2);
  // 긴 이름부터 치환(부분매칭 방지)
  names.sort((a,b)=>b.length-a.length).forEach(nm=>{
    t = t.split(nm).join(maskName(nm));
  });
  return t;
}
const attendMembers = () => S.members.filter(m=>m.attend && m.name);
const realAgendas = () => S.agendas.filter(a=>a.name);

/* ───────────── 네비게이션 ───────────── */
const DOCS = [
  {id:'home', name:'🏠 사용방법', sec:'안내'},
  {id:'base', name:'기초자료', sec:'입력'},
  {id:'d1', name:'1. 안건제출', sec:'회의 전'},
  {id:'d2', name:'2. 개최 통보'},
  {id:'d3', name:'3. 개최 공고문'},
  {id:'d4', name:'4. 가정통신문(개최)'},
  {id:'d5', name:'5. 회의참석자명부'},
  {id:'d6', name:'6. 회의록 표지', sec:'회의 후'},
  {id:'d7', name:'7. 회의록'},
  {id:'d8', name:'8. 심의결과통보'},
  {id:'d9', name:'9. 결과 안내(공고)'},
  {id:'d10', name:'10. 가정통신문(결과)'},
  {id:'sc', name:'📢 회의 진행 시나리오', sec:'회의 진행'},
  {id:'rec', name:'👤 개방이사 추천', sec:'기타 서식'},
];
let cur = 'home';
let editMode = false;

function renderNav(){
  let html = '', lastSec = '';
  DOCS.forEach(d=>{
    if(d.sec && d.sec !== lastSec){ html += `<div class="sec">${d.sec}</div>`; lastSec = d.sec; }
    html += `<button class="${cur===d.id?'active':''}" onclick="go('${d.id}')">${d.name}</button>`;
  });
  $('nav').innerHTML = html;
}
function go(id){
  cur = id;
  editMode = false;
  renderNav();
  $('pageTitle').textContent = DOCS.find(d=>d.id===id).name;
  const isDoc = id !== 'base' && id !== 'home';
  $('printBtn').style.display = isDoc ? '' : 'none';
  $('copyBtn').style.display = isDoc ? '' : 'none';
  $('pdfBtn').style.display = isDoc ? '' : 'none';
  $('hwpxBtn').style.display = isDoc ? '' : 'none';
  const mb = $('maskBox');
  if(mb){ mb.style.display = (cur==='d7') ? 'inline-flex' : 'none'; const c=$('maskChk'); if(c) c.checked = S.maskNames; }
  const eb = $('editBtn');
  eb.style.display = isDoc ? '' : 'none';
  eb.textContent = '✏️ 직접 수정';
  eb.classList.remove('primary');
  render();
}

/* ───────────── 복사 · 직접수정 ───────────── */
function copyText(btn){
  const paper = document.querySelector('.paper');
  if(!paper) return;
  const text = paper.innerText.replace(/\n{3,}/g,'\n\n').trim();
  navigator.clipboard.writeText(text).then(()=>{
    const t = btn.textContent;
    btn.textContent = '✅ 복사됨';
    setTimeout(()=>btn.textContent = t, 1500);
  }).catch(()=>{
    // 클립보드 미지원 시 폴백
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    btn.textContent = '✅ 복사됨';
    setTimeout(()=>btn.textContent = '📋 텍스트 복사', 1500);
  });
}
function savePDF(){
  // 브라우저 인쇄 파이프라인 사용 → 긴 문서도 페이지 자동 분할(잘림 없음)
  const docName = DOCS.find(d=>d.id===cur).name.replace(/^[0-9]+\\.\\s*/,'').replace(/[🏠📢👤\\s]/g,'');
  const prevTitle = document.title;
  document.title = `${S.year}학년도_제${S.round}회_${docName}_${S.school}`;
  const msg = 'PDF로 저장하는 방법\\n\\n' +
    '곧 인쇄 창이 열립니다. 종이로 인쇄하는 게 아니라 아래처럼 하면 PDF 파일로 저장됩니다.\\n\\n' +
    '1. 인쇄 창의 "프린터" 또는 "대상" 칸을 클릭\\n' +
    '2. 목록에서 "PDF로 저장"(Save as PDF) 선택\\n' +
    '3. "저장" 버튼 클릭 → 파일명 정하고 저장\\n\\n' +
    '확인을 누르면 인쇄 창이 열립니다.';
  if(!confirm(msg)){ document.title = prevTitle; return; }
  window.print();
  setTimeout(()=>{ document.title = prevTitle; }, 500);
}
function toggleEdit(btn){
  const paper = document.querySelector('.paper');
  if(!paper) return;
  editMode = !editMode;
  paper.contentEditable = editMode;
  if(editMode){
    btn.textContent = '✔ 수정 완료';
    btn.classList.add('primary');
    paper.style.outline = '2px dashed var(--gold)';
    paper.focus();
  }else{
    btn.textContent = '✏️ 직접 수정';
    btn.classList.remove('primary');
    paper.style.outline = 'none';
  }
}

/* ───────────── 홈(사용방법) ───────────── */
function renderHome(){
  const step = (n,t,d)=>`<div style="display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--line);">

    <div><div style="font-weight:700; color:var(--navy); font-size:14px; margin-bottom:3px;">${t}</div>
    <div style="font-size:12.5px; color:#3d4653; line-height:1.7;">${d}</div></div></div>`;
  $('content').innerHTML = `
  <div class="council-home">
    <div class="card council-intro">
      <div class="body" style="padding:28px 30px;">

        <h1 style="font-size:24px; color:var(--navy); margin:6px 0 8px;">학교운영위원회<br>자동서식 프로그램</h1>
        <p style="font-size:13px; color:var(--muted); line-height:1.7;">기초자료 한 번 입력으로 안건제출부터 회의록·결과 안내까지<br>학교운영위원회 문서 10종이 자동 생성됩니다.</p>
      </div>
    </div>
    <div class="card council-guide"><h2>사용 방법</h2><div class="body">
      ${step(1,'기초자료 입력','왼쪽 메뉴 <b>[기초자료]</b> 맨 위 <b>📗 기초자료 일괄 업로드</b>에서 <b>⬇ 통합 양식</b>(시트 3개: 기본정보·안건·위원명단)을 받아 채운 뒤 올리면 학교정보·회의정보·안건·위원명단이 한 번에 입력됩니다. 직접 타이핑하거나 안건·명단만 따로 업로드해도 됩니다.')}
      ${step(2,'회의 전 문서 출력','안건제출 → 개최 통보 → 개최 공고문 → 가정통신문 → 참석자명부 순으로 자동 생성됩니다. 각 문서에서 <b>🖨 인쇄</b> 버튼으로 A4 출력하세요.')}
      ${step(3,'회의 후 결과 입력','기초자료의 안건 목록에서 <b>발언내용·찬성/반대 표수·결정사항</b>을 입력하고, 운영위원 명단에서 <b>출석 체크</b>를 하면 회의록이 완성됩니다.')}
      ${step(4,'인쇄 · PDF 저장','문서 화면에서 <b>🖨 인쇄</b>는 종이 출력, <b>📄 PDF 저장</b>은 파일로 저장입니다. PDF 저장을 누르면 인쇄 창이 열리는데, <b>프린터(대상) 칸에서 "PDF로 저장"을 선택</b>하고 저장하면 됩니다. 회의록처럼 긴 문서도 여러 장으로 자동 분할되어 잘리지 않습니다.')}
      ${step(5,'수정 · 복사 · 백업','문서 화면에서 <b>✏️ 직접 수정</b>으로 문구를 바로 고칠 수 있고(인쇄 전 임시수정), <b>📋 텍스트 복사</b>로 K-에듀파인 등에 붙여넣을 수 있습니다. <b>💾 저장(JSON)</b>으로 회차별 파일을 보관했다가 <b>📂 불러오기</b>로 이어서 작업하세요.')}
      <p class="note" style="margin-top:12px;">※ 직접 수정한 내용은 인쇄용 임시 수정입니다. 다른 메뉴로 이동하면 기초자료 기준으로 다시 생성되니, 계속 쓸 내용은 기초자료에 입력하세요.</p>
    </div></div>
    <div class="card council-start"><div class="body">
      <p class="council-start-note">학교 정보와 회의 자료를 입력해 시작하세요.</p>
      <button class="btn primary" onclick="go('base')">기초자료 입력 시작 →</button>
    </div></div>
  </div>`;
}

/* ───────────── 기초자료 화면 ───────────── */
function renderBase(){
  const f = (k,label,ph)=>`<div class="fld"><label>${label}</label><input id="f_${k}" value="${esc(S[k])}" placeholder="${ph||''}" oninput="S.${k}=this.value; sync()"></div>`;
  $('content').innerHTML = `
  <div class="card" style="border-left:4px solid var(--gold);"><div class="body" style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">

function agendaListGa(){ // 가) 나) 다) + 마지막 기타.
  const KA = ['가','나','다','라','마','바','사','아','자','차','카','타','파','하'];
  const items = realAgendas().map((a,i)=>`<div class="indent">${KA[i]||i+1}) ${esc(a.name)}</div>`).join('');
  const etcIdx = realAgendas().length;
  return items + `<div class="indent">${KA[etcIdx]||etcIdx+1}) 기타.</div>`;
}
function agendaListNum(){ // 1) 2) 3) + 기타.
  const items = realAgendas().map((a,i)=>`<div class="indent2">${i+1}) ${esc(a.name)}</div>`).join('');
  return items + `<div class="indent2">${realAgendas().length+1}) 기타.</div>`;
}
function agendaTable(withResult){
  const real = realAgendas();
  // 결과 문서(심의결과 표)에는 회기 결정의 건을 1번으로 포함
  const sessionRow = {name:`제${S.round||'○'}회 학교운영위원회 ${S.mtype} 회기 결정의 건`, dept:'-', result:'원안 가결'};
  const list = withResult && S.useSession!==false ? [sessionRow, ...real] : real;
  const rows = list.length ? list : [{name:'',dept:'',result:''}];
  return `<table class="doc"><tr><th style="width:20mm; white-space:nowrap;">안건번호</th><th>안 건 명</th><th style="width:28mm">제안부서</th>${withResult?'<th style="width:26mm">심의결과</th>':''}</tr>

}

}

/* ───────────── 엑셀 업로드 ───────────── */
function uploadExcel(e, kind){
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const wb = XLSX.read(r.result, {type:'array'});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
      const data = rows.map(row => row.map(c => String(c).trim())).filter(row => row.some(c => c));
      if(!data.length){ alert('데이터가 없습니다.'); return; }
      // 첫 행이 헤더(제목행)이면 제외
      const head = data[0].join('');
      const body = (/안건|성명|구분|이름|연번|번호/.test(head)) ? data.slice(1) : data;
      if(kind === 'agenda'){
        const items = body.map(row => {
          // 첫 칸이 숫자(연번)면 한 칸 밀기
          const off = /^\d+$/.test(row[0]) ? 1 : 0;

function toISO(v){ // 엑셀 날짜(Date/직렬번호/문자열) → yyyy-mm-dd
  if(v === '' || v == null) return '';
  if(v instanceof Date && !isNaN(v)){
    return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  }
  if(typeof v === 'number'){
    const d = new Date(Date.UTC(1899,11,30) + Math.round(v)*86400000);
    return d.toISOString().slice(0,10);
  }
  const s = String(v).trim().replace(/[.\/]/g,'-').replace(/-+$/,'');
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : s;
}
function toHM(v){ // 엑셀 시간(Date/소수/문자열) → HH:MM
  if(v === '' || v == null) return '';
  if(v instanceof Date && !isNaN(v)){
    return `${String(v.getHours()).padStart(2,'0')}:${String(v.getMinutes()).padStart(2,'0')}`;
  }
  if(typeof v === 'number'){ // 0~1 소수 = 하루 중 시각
    const mins = Math.round((v % 1) * 24 * 60);
    return `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`;
  }
  const s = String(v).trim();
  const m = s.match(/(\d{1,2}):(\d{2})/);
  return m ? `${m[1].padStart(2,'0')}:${m[2]}` : s;
}

        else if(key === 'mtime' || key === 'endTime') S[key] = toHM(val);

                  email:String(row[off+2]||'').trim(), note:String(row[off+3]||'').trim(), attend:true};
        }).filter(m => m.name);

      if(!cntF && !cntA && !cntM){ alert('읽을 데이터가 없습니다. 통합 양식을 확인하세요.'); return; }

    }catch(err){ alert('엑셀을 읽을 수 없습니다: ' + err.message); }
  };
  r.readAsArrayBuffer(file);
  e.target.value = '';
}

/* ================= 한글(HWPX) 저장 =================
   미리보기 용지(.paper)에 보이는 칸(td·격자 div)의 화면 위치를 재서 한글 표 하나로 합친다.
   - 위아래로 맞붙은 표·격자는 하나의 표로 합침 (선 위치를 모아 행·열 격자를 만들고 병합 칸으로 배치)
   - 미리보기에서 직접 고친 내용(contenteditable)도 그대로 들어감
   - 용지 1장 = 한글 1쪽 (다음 용지는 쪽 나눔)
   - zip 은 압축 없이(STORE) 직접 묶음 — 외부 라이브러리 없음
   사용: saveHwpx('content','파일이름') — 법인회계Master 와 같은 코드 */
const HWPX={
  PAGE_W:59528,PAGE_H:84188,                 // A4 (HWPUNIT: 1mm ≈ 283.46)
  MARGIN:{left:4252,right:4252,top:4252,bottom:4252}, // 인쇄 여백 15mm (@page 와 같게)
  FONT:'함초롬바탕',
  SNAP:3,                                     // 이 픽셀 이내의 선은 같은 선으로 봄
  NOPRINT:'.no-print,.noprint'
};
function hwpxEsc(s){return String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hwpxColor(css){ // 'rgb(242, 242, 242)' → '#F2F2F2' (투명·흰색이면 null)
  const m=String(css).match(/rgba?\(([^)]+)\)/);if(!m)return null;
  const v=m[1].split(',').map(x=>parseFloat(x));
  if(v.length>3&&v[3]===0)return null;
  if(v[0]>=254&&v[1]>=254&&v[2]>=254)return null;
  return '#'+v.slice(0,3).map(n=>Math.round(n).toString(16).padStart(2,'0')).join('').toUpperCase();
}
function hwpxAlign(el,cs){
  if(cs.position==='absolute'&&el.parentElement){ // 따로 띄운 글(예: 적요 칸 오른쪽 금액)은 가까운 쪽으로 정렬
    const r=el.getBoundingClientRect(),pr=el.parentElement.getBoundingClientRect();
    if(pr.right-r.right<r.left-pr.left)return 'RIGHT';
  }
  if(cs.display==='flex'||cs.display==='grid'){
    if(cs.justifyContent==='center')return 'CENTER';
    if(/end|right/.test(cs.justifyContent))return 'RIGHT';
  }
  const t=cs.textAlign;
  if(t==='center'||t==='-webkit-center')return 'CENTER';
  if(t==='right'||t==='end'||t==='-webkit-right')return 'RIGHT';
  if(t==='justify')return 'JUSTIFY';
  return 'LEFT';
}
function hwpxHidden(el){const cs=getComputedStyle(el);return cs.display==='none'||cs.visibility==='hidden'||el.matches(HWPX.NOPRINT);}
/* 요소 안의 글을 문단 목록으로 — 자식이 모두 블록이면 자식마다(정렬·글자크기 각자), 아니면 줄 단위 */
function hwpxParas(el){
  if(hwpxHidden(el))return [];
  const kids=[...el.childNodes];
  const elKids=kids.filter(n=>n.nodeType===1&&!hwpxHidden(n));
  const directText=kids.some(n=>n.nodeType===3&&n.textContent.trim());
  const allBlock=elKids.length>0&&!directText&&elKids.every(k=>k.tagName!=='BR'&&!/^inline/.test(getComputedStyle(k).display));
  if(allBlock)return elKids.flatMap(hwpxParas);
  const cs=getComputedStyle(el);
  const lines=(el.innerText||'').replace(/ /g,' ').replace(/\r/g,'').split('\n');
  while(lines.length&&!lines[0].trim())lines.shift();
  while(lines.length&&!lines[lines.length-1].trim())lines.pop();
  const pt=parseFloat(cs.fontSize)*0.75, bold=(parseInt(cs.fontWeight,10)||400)>=600, align=hwpxAlign(el,cs);
  const lh=parseFloat(cs.lineHeight)/parseFloat(cs.fontSize);           // 'normal'이면 NaN
  const ls=isNaN(lh)?130:Math.min(300,Math.max(100,Math.round(lh*100)));
  return lines.map(t=>({text:t,pt,bold,align,ls}));
}
function hwpxBordered(el){const cs=getComputedStyle(el);return ['Top','Right','Bottom','Left'].some(s=>hwpxSide(cs,s));}
function hwpxVisKids(el){return [...el.children].filter(k=>!hwpxHidden(k)&&k.getBoundingClientRect().width>0);}
/* 가로 줄(flex row) 안에 글 상자가 2개 이상 — 칸으로 나눠 위치를 살림 (예: "년도 법인회계 … 증제 1 호", 감사 서명줄, 표지 세입·세출 상자) */
function hwpxFlexRow(el){
  const cs=getComputedStyle(el);
  if(!/flex/.test(cs.display)||!/^row/.test(cs.flexDirection))return false;
  if([...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim()))return false;
  const kids=hwpxVisKids(el);
  return kids.length>=2&&kids.every(k=>k.tagName!=='TABLE'&&!k.querySelector('table'));
}
/* 이 요소(또는 안쪽)에 표처럼 다뤄야 할 것이 있나: 표·격자·가로 줄·테두리 상자 */
function hwpxHasBoxes(el){
  if(el.querySelector('table'))return true;
  return [...el.querySelectorAll('*')].some(d=>!hwpxHidden(d)&&(getComputedStyle(d).display==='grid'||hwpxFlexRow(d)||hwpxBordered(d)));
}
/* 용지 한 장을 블록 목록으로: {type:'boxes',boxes:[...]} 또는 {type:'text',el} (화면 순서) */
function hwpxBlocks(paper){
  const out=[];
  const addBoxes=(list)=>{
    if(!list.length)return;
    const top=Math.min(...list.map(b=>b.rect.top)),bottom=Math.max(...list.map(b=>b.rect.bottom));
    const last=out[out.length-1];
    if(last&&last.type==='boxes'&&top<=last.bottom+HWPX.SNAP){last.boxes.push(...list);last.bottom=Math.max(last.bottom,bottom);last.top=Math.min(last.top,top);}
    else out.push({type:'boxes',boxes:list,top,bottom});
  };
  const box=(el)=>({el,rect:el.getBoundingClientRect()});
  const walk=(node)=>{
    for(const ch of node.children){
      if(hwpxHidden(ch))continue;
      const r=ch.getBoundingClientRect();if(!(r.width>0&&r.height>0))continue;
      const cs=getComputedStyle(ch);
      if(ch.tagName==='TABLE'){
        const list=[];
        for(const row of ch.rows)for(const cell of row.cells){const cr=cell.getBoundingClientRect();if(cr.width>0&&cr.height>0)list.push(box(cell));}
        addBoxes(list);
      }else if(cs.display==='grid'||hwpxFlexRow(ch)){
        const kids=hwpxVisKids(ch).map(box);

/* 선 위치 모으기: 가까운 값끼리 합쳐 정렬된 선 목록 */

    `<hh:styles itemCnt="1"><hh:style id="0" type="PARA" name="바탕글" engName="Normal" paraPrIDRef="0" charPrIDRef="0" nextStyleIDRef="0" langID="1042" lockForm="0"/></hh:styles>`+
    `</hh:refList><hh:compatibleDocument targetProgram="HWP2018"><hh:layoutCompatibility/></hh:compatibleDocument></hh:head>`;
  const container=`<?xml version="1.0" encoding="UTF-8" standalone="yes" ?>\n<ocf:container xmlns:ocf="urn:oasis:names:tc:opendocument:xmlns:container" xmlns:hpf="http://www.hancom.co.kr/schema/2011/hpf"><ocf:rootfiles><ocf:rootfile full-path="Contents/content.hpf" media-type="application/hwpml-package+xml"/></ocf:rootfiles></ocf:container>`;
  const hpf=`<?xml version="1.0" encoding="UTF-8" standalone="yes" ?>\n<opf:package xmlns:opf="http://www.idpf.org/2007/opf/" xmlns:hpf="http://www.hancom.co.kr/schema/2011/hpf" xmlns:hh="http://www.hancom.co.kr/hwpml/2011/head"><opf:metadata><opf:meta name="generator" content="법인회계Master"/></opf:metadata>`+
    `<opf:manifest><opf:item id="header" href="Contents/header.xml" media-type="application/xml"/><opf:item id="section0" href="Contents/section0.xml" media-type="application/xml"/></opf:manifest>`+
    `<opf:spine><opf:itemref idref="header" linear="no"/><opf:itemref idref="section0" linear="yes"/></opf:spine></opf:package>`;
  return [
    ['mimetype','application/hwp+zip'],
    ['META-INF/container.xml',container],
    ['Contents/content.hpf',hpf],
    ['Contents/header.xml',header],
    ['Contents/section0.xml',section],
    ['Preview/PrvText.txt',prv.join('\r\n').slice(0,1000)]
  ];
}
/* 압축 없는(STORE) zip — mimetype 이 맨 앞이어야 한글이 HWPX 로 인식 */
function hwpxZip(files){
  const enc=new TextEncoder();
  const crcT=hwpxZip.t||(hwpxZip.t=Array.from({length:256},(_,n)=>{let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0;}));
  const crc=(d)=>{let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=crcT[(c^d[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
  const parts=[],central=[];let off=0;
  const u16=(v)=>[v&0xFF,(v>>>8)&0xFF],u32=(v)=>[v&0xFF,(v>>>8)&0xFF,(v>>>16)&0xFF,(v>>>24)&0xFF];
  for(const [name,text] of files){
    const nm=enc.encode(name),data=enc.encode(text),c=crc(data);
    const common=[...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(data.length),...u32(data.length),...u16(nm.length),...u16(0)];
    const local=new Uint8Array([...u32(0x04034b50),...common]);
    parts.push(local,nm,data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...common,...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=local.length+nm.length+data.length;
  }
  const cdSize=central.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,end],{type:'application/hwp+zip'});
}
function saveHwpx(hostId,fileBase){
  const papers=[...document.querySelectorAll('#'+hostId+' .paper')].filter(p=>p.getBoundingClientRect().width>0);
  if(!papers.length){alert('미리보기를 먼저 열어 주세요.');return;}
  let blob;
  try{blob=hwpxZip(hwpxBuild(papers));}
  catch(e){console.error(e);alert('한글 파일을 만드는 중 문제가 생겼어요. PDF 저장을 이용해 주세요.\n('+e.message+')');return;}
  const name=String(fileBase||'문서').replace(/[\\/:*?"<>|]/g,'_')+'.hwpx';
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
function saveHWPX(){
  const docName=DOCS.find(d=>d.id===cur).name.replace(/^[0-9]+\.\s*/,'').replace(/[🏠📢👤\s]/g,'');
  saveHwpx('content',`${S.year}학년도_제${S.round}회_${docName}_${S.school}`);
}
